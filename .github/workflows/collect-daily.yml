name: Collect Polymarket data

on:
  schedule:
    # 06:17 UTC daily (off the hour to avoid GitHub's cron rush)
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run collector
        run: node scripts/collect.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/markets.json data/history.jsonl
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily Polymarket data collection"
            git push
          fi
